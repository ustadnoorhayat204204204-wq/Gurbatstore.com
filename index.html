<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gurbat Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
        }

        /* Full screen hero section */
        .hero {
            height: 100vh;
            background: linear-gradient(
                rgba(0,0,0,0.6),
                rgba(0,0,0,0.6)
            ),
            url("https://images.unsplash.com/photo-1523275335684-37898b6baf30");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .hero a {
            padding: 12px 25px;
            background: #ff9800;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        /* Store section */
        .store {
            padding: 50px 20px;
            background: #111;
        }

        .store h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .product {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .product img {
            width: 100%;
            border-radius: 10px;
        }

        .product h3 {
            margin: 15px 0 10px;
        }

        .product p {
            margin-bottom: 10px;
        }

        .product button {
            padding: 10px 20px;
            border: none;
            background: #ff9800;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #000;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <div>
            <h1>GURBAT STORE</h1>
            <p>Premium Products • Best Quality • Best Price</p>
            <a href="#store">Shop Now</a>
        </div>
    </section>

    <!-- STORE -->
    <section id="store" class="store">
        <h2>Our Products</h2>

        <div class="products">
            <div class="product">
                <img src="https://images.unsplash.com/photo-1513708927688-890ace6c6c83">
                <h3>Product One</h3>
                <p>$25.00</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
                <h3>Product Two</h3>
                <p>$40.00</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">
                <h3>Product Three</h3>
                <p>$60.00</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        © 2026 Gurbat.com | All Rights Reserved
    </footer>

</body>
</html>
